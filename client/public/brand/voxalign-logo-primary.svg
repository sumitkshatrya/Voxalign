<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52DDBB" />
      <stop offset="100%" stop-color="#64C8FF" />
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#52DDBB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#64C8FF" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 5) scale(0.85)">
    <!-- Left arm of the geometric V -->
    <path d="M14 18 L32 18 L50 68 L41 68 Z" fill="url(#pGrad)" />
    <!-- Right arm of the geometric V -->
    <path d="M86 18 L68 18 L50 68 L59 68 Z" fill="url(#pGrad)" />

    <!-- Central timestamp pin -->
    <circle cx="50" cy="78" r="4.5" fill="#52DDBB" filter="url(#pGlow)" />
    <line x1="50" y1="68" x2="50" y2="78" stroke="#52DDBB" stroke-width="2.5" stroke-dasharray="1 1" />

    <!-- Waveform bars -->
    <rect x="36" y="34" width="3.5" height="18" rx="1.75" fill="url(#wGrad)" />
    <circle cx="37.75" cy="34" r="2" fill="#52DDBB" />

    <rect x="43" y="24" width="3.5" height="34" rx="1.75" fill="url(#wGrad)" />
    <circle cx="44.75" cy="24" r="2" fill="#64C8FF" />

    <rect x="50" y="16" width="3.5" height="46" rx="1.75" fill="url(#wGrad)" />
    <circle cx="51.75" cy="16" r="2.5" fill="#F5F8FC" filter="url(#pGlow)" />

    <rect x="57" y="24" width="3.5" height="34" rx="1.75" fill="url(#wGrad)" />
    <circle cx="58.75" cy="24" r="2" fill="#64C8FF" />

    <rect x="64" y="34" width="3.5" height="18" rx="1.75" fill="url(#wGrad)" />
    <circle cx="65.75" cy="34" r="2" fill="#52DDBB" />

    <!-- Timeline baseline -->
    <line x1="28" y1="88" x2="72" y2="88" stroke="#64C8FF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="34" cy="88" r="2" fill="#52DDBB" />
    <circle cx="50" cy="88" r="2.5" fill="#64C8FF" />
    <circle cx="66" cy="88" r="2" fill="#52DDBB" />
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(108, 48)">
    <text font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" letter-spacing="-0.5">
      <tspan fill="#F5F8FC">Vox</tspan><tspan fill="url(#pGrad)">Align</tspan>
    </text>
  </g>

  <!-- TAGLINE -->
  <g transform="translate(110, 68)">
    <text font-family="'JetBrains Mono', 'Inter', monospace" font-weight="500" font-size="10" fill="#94A3B8" letter-spacing="2.8">
      EVERY WORD. EVERY SECOND. ALIGNED.
    </text>
  </g>
</svg>
